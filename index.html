<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Bultum Academy — Daily Schedule 2026–27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4efe4; --surface:#fffdf8; --surface2:#faf6ec;
  --ink:#232a20; --muted:#6d7164; --faint:#9a9c8f;
  --line:#e3dccb; --line2:#efe9db;
  --pine:#1f5c46; --pine-d:#123a2c; --gold:#cf9b2e;
  /* subject colors: [text, bg, spine] */
  --ela:#3c4fb0;      --ela-bg:#e9ecfb;
  --math:#a9701a;     --math-bg:#f9edd4;
  --science:#1c7a6c;  --science-bg:#dcefeb;
  --special:#8a4a9e;  --special-bg:#f2e6f6;
  --break:#a06a35;    --break-bg:#f1e6d4;
  --community:#c05743; --community-bg:#f9e5df;
  --logistics:#5b6572; --logistics-bg:#e8ebee;
  --intervention:#ac3f78; --intervention-bg:#f6e1ec;
  --other:#6d7164;    --other-bg:#eceadf;
  --radius:14px;
  --shadow:0 1px 2px rgba(30,40,25,.04),0 6px 22px rgba(30,40,25,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);
  font-family:Inter,system-ui,sans-serif;line-height:1.5;
  -webkit-font-smoothing:antialiased;}
.wrap{max-width:1060px;margin:0 auto;padding:0 18px 80px}

/* header */
header.top{position:sticky;top:0;z-index:40;background:rgba(244,239,228,.86);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.top-in{max-width:1060px;margin:0 auto;padding:14px 18px;display:flex;
  align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:40px;height:40px;flex:none;border-radius:11px;background:var(--pine);
  display:grid;place-items:center;box-shadow:var(--shadow)}
.mark svg{width:24px;height:24px}
.brand .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--pine);font-weight:600;font-family:'Space Grotesk'}
.brand h1{margin:0;font-family:'Space Grotesk';font-weight:600;font-size:19px;letter-spacing:-.01em}
.brand h1 span{color:var(--faint);font-weight:500}
.clock{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.clock .t{font-family:'Space Mono';font-weight:700;font-size:19px;letter-spacing:-.02em}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);
  font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.live{background:var(--pine);box-shadow:0 0 0 0 rgba(31,92,70,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,92,70,.45)}70%{box-shadow:0 0 0 7px rgba(31,92,70,0)}100%{box-shadow:0 0 0 0 rgba(31,92,70,0)}}

/* view tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 4px}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--muted);
  font-family:'Space Grotesk';font-weight:500;font-size:13.5px;padding:8px 15px;border-radius:999px;
  cursor:pointer;transition:.15s;white-space:nowrap}
.tab:hover{border-color:var(--pine);color:var(--pine)}
.tab.active{background:var(--pine);color:#fff;border-color:var(--pine)}

/* chip picker */
.picker{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 4px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-family:'Space Grotesk';font-weight:500;font-size:13px;padding:7px 13px;border-radius:10px;
  cursor:pointer;transition:.13s;line-height:1.1}
.chip:hover{border-color:var(--gold);background:var(--surface2)}
.chip.active{border-color:var(--pine);background:#eef4f0;color:var(--pine-d);
  box-shadow:inset 0 0 0 1px var(--pine)}

/* now banner */
.nowbar{display:flex;align-items:center;gap:14px;margin:18px 0 6px;padding:15px 18px;
  background:linear-gradient(100deg,#eef4f0,#faf6ec);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow)}
.nowbar .big{font-family:'Space Grotesk';font-weight:600;font-size:16px;letter-spacing:-.01em}
.nowbar .lil{font-size:12.5px;color:var(--muted);margin-top:1px}
.nowbar .time{font-family:'Space Mono';font-weight:700;font-size:15px;color:var(--pine)}
.nowbar .spine{width:5px;align-self:stretch;border-radius:4px;background:var(--pine)}

/* view controls */
.viewbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0 12px;flex-wrap:wrap}
.viewtitle{font-family:'Space Grotesk';font-weight:600;font-size:22px;letter-spacing:-.02em}
.viewtitle small{display:block;font-family:Inter;font-weight:500;font-size:12.5px;color:var(--muted);letter-spacing:0;margin-top:2px}
.modes{display:flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.mode{padding:7px 14px;font-family:'Space Grotesk';font-size:12.5px;font-weight:500;color:var(--muted);
  cursor:pointer;border:none;background:none;display:flex;align-items:center;gap:6px}
.mode.active{background:var(--pine);color:#fff}
.mode svg{width:14px;height:14px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;
  padding:7px 13px;font-family:'Space Grotesk';font-size:12.5px;font-weight:500;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--pine);color:var(--pine)}
.btn svg{width:14px;height:14px}

/* AGENDA (list) */
.agenda{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:118px 1fr;gap:14px;align-items:stretch;
  background:var(--surface);border:1px solid var(--line2);border-radius:var(--radius);
  padding:0;overflow:hidden;transition:.15s;position:relative}
.ev .when{padding:14px 0 14px 16px;display:flex;flex-direction:column;justify-content:center}
.ev .when .s{font-family:'Space Mono';font-weight:700;font-size:14px;letter-spacing:-.03em}
.ev .when .e{font-family:'Space Mono';font-size:12px;color:var(--faint);letter-spacing:-.03em}
.ev .body{padding:13px 16px 13px 15px;border-left:5px solid var(--sp,var(--other));display:flex;
  flex-direction:column;justify-content:center;min-width:0}
.ev .name{font-family:'Space Grotesk';font-weight:600;font-size:15.5px;letter-spacing:-.01em;line-height:1.25}
.ev .tag{align-self:flex-start;margin-top:6px;font-size:11px;font-weight:600;letter-spacing:.03em;
  text-transform:uppercase;padding:2px 8px;border-radius:6px}
.ev.now{border-color:var(--pine);box-shadow:0 0 0 2px rgba(31,92,70,.16),var(--shadow)}
.ev.now .when{background:var(--pine);}
.ev.now .when .s{color:#fff}.ev.now .when .e{color:#cfe0d8}
.ev.now::after{content:'NOW';position:absolute;top:10px;right:12px;font-family:'Space Grotesk';
  font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--pine);
  background:#eef4f0;border:1px solid var(--pine);padding:2px 7px;border-radius:6px}
.ev.past{opacity:.5}

/* TIMELINE */
.timeline{position:relative;margin-top:8px;background:var(--surface);border:1px solid var(--line2);
  border-radius:var(--radius);padding:12px 12px 12px 0;overflow:hidden}
.tl-inner{position:relative;margin-left:66px}
.hour{position:absolute;left:-66px;right:0;border-top:1px dashed var(--line);}
.hour span{position:absolute;left:0;top:-8px;font-family:'Space Mono';font-size:11px;color:var(--faint);width:58px;text-align:right}
.tlblock{position:absolute;left:0;right:8px;border-radius:9px;padding:5px 11px;overflow:hidden;
  border-left:5px solid var(--sp,var(--other));display:flex;flex-direction:column;justify-content:flex-start;
  background:var(--bg,var(--surface2))}
.tlblock .n{font-family:'Space Grotesk';font-weight:600;font-size:13px;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlblock .tm{font-family:'Space Mono';font-size:10.5px;color:var(--muted);margin-top:1px}
.tlblock.now{outline:2px solid var(--pine);outline-offset:-1px;box-shadow:var(--shadow);z-index:5}
.nowline{position:absolute;left:-66px;right:8px;height:2px;background:var(--community);z-index:8}
.nowline::before{content:'';position:absolute;left:0;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--community)}
.nowline span{position:absolute;right:0;top:-18px;font-family:'Space Mono';font-weight:700;font-size:10px;color:#fff;background:var(--community);padding:1px 6px;border-radius:5px}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:22px 0 6px;padding:15px 18px;
  background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius)}
.legend b{width:100%;font-family:'Space Grotesk';font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:2px}
.lg{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);font-weight:500}
.sw{width:13px;height:13px;border-radius:4px}

/* tables (interventions) */
.section{margin-top:22px;background:var(--surface);border:1px solid var(--line2);border-radius:var(--radius);overflow:hidden}
.section h3{margin:0;font-family:'Space Grotesk';font-weight:600;font-size:15px;padding:14px 18px;
  background:var(--surface2);border-bottom:1px solid var(--line);letter-spacing:-.01em}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-family:'Space Grotesk';font-weight:600;text-align:left;color:var(--muted);
  background:var(--surface2);padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px;letter-spacing:.02em}
td{padding:9px 14px;border-bottom:1px solid var(--line2);vertical-align:top}
td:nth-child(2){font-family:'Space Mono';font-size:12px}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface2)}

footer{margin-top:34px;text-align:center;color:var(--faint);font-size:12px}
footer .tree{font-family:'Space Grotesk';color:var(--pine);font-weight:600}

@media(max-width:620px){
  .brand h1{font-size:16px}
  .ev{grid-template-columns:96px 1fr}
  .viewtitle{font-size:19px}
  .clock .t{font-size:16px}
}
@media print{
  header.top,.tabs,.picker,.modes,.btn,.nowbar,.dot{display:none!important}
  body{background:#fff}.ev,.section,.timeline{box-shadow:none}
  .ev.past{opacity:1}
}
</style>
</head>

const SCHOOL_START=480, SCHOOL_END=985; // 8:00 - 4:25

// ---- state ----
let view='grades', sel=DATA.gradeOrder[0], mode='list';

// ---- helpers ----
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function fmt(m){if(m==null)return'';let h=Math.floor(m/60),mm=m%60,ap=h<12?'AM':'PM',h12=h%12||12;return h12+':'+String(mm).padStart(2,'0')+' '+ap;}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes();}
function isSchoolDay(){const d=new Date().getDay();return d>=1&&d<=5;}

// ---- current schedule accessor ----
function currentList(){
  if(view==='grades')return DATA.grades[sel]||[];
  if(view==='specials')return DATA.specials[sel]||[];
  if(view==='ell')return DATA.ell[sel]||[];
  return [];
}
function currentTitle(){
  if(view==='grades')return {t:(DATA.gradeLabels[sel]||sel)+' — Homeroom',s:'Monday through Friday daily plan'};
  if(view==='specials')return {t:sel,s:'Specialist rotation across grades'};
  if(view==='ell')return {t:'ELL — '+sel,s:'English language learner support'};
  return {t:'Intervention Schedules',s:'Small-group & pull-out support'};
}

// ---- tabs ----
const TABS=[['grades','Grades'],['specials','Specials'],['ell','ELL'],['interv','Interventions']];
function buildTabs(){
  const el=document.getElementById('tabs');el.innerHTML='';
  TABS.forEach(([k,label])=>{
    const b=document.createElement('button');b.className='tab'+(view===k?' active':'');b.textContent=label;
    b.onclick=()=>{view=k; if(k==='grades')sel=DATA.gradeOrder[0];
      else if(k==='specials')sel=Object.keys(DATA.specials)[0];
      else if(k==='ell')sel=Object.keys(DATA.ell)[0];
      render();};
    el.appendChild(b);
  });
}
// ---- picker ----
function buildPicker(){
  const el=document.getElementById('picker');el.innerHTML='';
  let items=[];
  if(view==='grades')items=DATA.gradeOrder.map(g=>[g,DATA.gradeLabels[g]||g]);
  else if(view==='specials')items=Object.keys(DATA.specials).map(k=>[k,k]);
  else if(view==='ell')items=Object.keys(DATA.ell).map(k=>[k,k]);
  else {el.style.display='none';return;}
  el.style.display='flex';
  items.forEach(([k,label])=>{
    const c=document.createElement('button');c.className='chip'+(sel===k?' active':'');c.textContent=label;
    c.onclick=()=>{sel=k;render();};el.appendChild(c);
  });
}
// ---- render agenda ----
function renderAgenda(list){
  const now=nowMin(),live=isSchoolDay();
  const wrap=document.createElement('div');wrap.className='agenda';
  list.forEach(b=>{
    const ev=document.createElement('div');ev.className='ev';
    const spine=css('--'+b.cat), bg=css('--'+b.cat+'-bg');
    ev.style.setProperty('--sp',spine);
    const isNow=live&&b.s!=null&&b.e!=null&&now>=b.s&&now<b.e;
    const isPast=live&&b.e!=null&&now>=b.e;
    if(isNow)ev.classList.add('now'); else if(isPast)ev.classList.add('past');
    ev.innerHTML=
      '<div class="when"><div class="s">'+fmt(b.s)+'</div><div class="e">'+(b.e!=null?fmt(b.e):'')+'</div></div>'+
      '<div class="body"><div class="name">'+esc(b.label)+'</div></div>';
    wrap.appendChild(ev);
  });
  return wrap;
}
// ---- render timeline ----
function renderTimeline(list){
  const now=nowMin(),live=isSchoolDay();
  const SCALE=2.25;
  const total=(SCHOOL_END-SCHOOL_START)*SCALE;
  const tl=document.createElement('div');tl.className='timeline';
  const inner=document.createElement('div');inner.className='tl-inner';inner.style.height=total+'px';
  for(let h=480;h<=SCHOOL_END;h+=60){
    const line=document.createElement('div');line.className='hour';
    line.style.top=((h-SCHOOL_START)*SCALE)+'px';
    line.innerHTML='<span>'+fmt(h)+'</span>';inner.appendChild(line);
  }
  list.forEach(b=>{
    if(b.s==null||b.e==null)return;
    const bl=document.createElement('div');bl.className='tlblock';
    bl.style.setProperty('--sp',css('--'+b.cat));
    bl.style.setProperty('--bg',css('--'+b.cat+'-bg'));
    bl.style.top=((b.s-SCHOOL_START)*SCALE)+'px';
    bl.style.height=Math.max((b.e-b.s)*SCALE-3,17)+'px';
    if(live&&now>=b.s&&now<b.e)bl.classList.add('now');
    bl.innerHTML='<div class="n">'+esc(b.label)+'</div><div class="tm">'+fmt(b.s)+' – '+fmt(b.e)+'</div>';
    inner.appendChild(bl);
  });
  if(live&&now>=SCHOOL_START&&now<=SCHOOL_END){
    const nl=document.createElement('div');nl.className='nowline';
    nl.style.top=((now-SCHOOL_START)*SCALE)+'px';
    nl.innerHTML='<span>'+fmt(now)+'</span>';inner.appendChild(nl);
  }
  tl.appendChild(inner);return tl;
}

// ---- interventions ----
function renderInterv(){
  const stage=document.getElementById('stage');stage.innerHTML='';
  DATA.interv.forEach(sec=>{
    if(sec.title==='Teacher Student Lists')return; // roster, keep app focused on schedules
    const wrap=document.createElement('div');wrap.className='section';
    const rows=sec.rows;if(!rows.length)return;
    const head=rows[0], body=rows.slice(1);
    let html='<h3>'+esc(sec.title)+'</h3><div class="tblwrap"><table><thead><tr>';
    head.forEach(h=>html+='<th>'+esc(h||'')+'</th>');
    html+='</tr></thead><tbody>';
    body.forEach(r=>{html+='<tr>';for(let i=0;i<head.length;i++)html+='<td>'+esc(r[i]||'')+'</td>';html+='</tr>';});
    html+='</tbody></table></div>';
    wrap.innerHTML=html;stage.appendChild(wrap);
  });
}

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

// ---- now banner ----
function updateNowBar(){
  const bar=document.getElementById('nowbar');
  if(view==='interv'){bar.style.display='none';return;}
  const list=currentList();const now=nowMin();const live=isSchoolDay();
  bar.style.display='flex';
  document.getElementById('nowtime').textContent=fmt(now);
  let cur=null,next=null;
  if(live)for(const b of list){if(b.s!=null&&b.e!=null&&now>=b.s&&now<b.e){cur=b;}
    else if(b.s!=null&&b.s>now&&!next){next=b;}}
  const who=(view==='grades')?(DATA.gradeLabels[sel]||sel):sel;
  if(cur){
    document.getElementById('nowbig').innerHTML='<b style="color:'+css('--'+cur.cat)+'">'+esc(cur.label)+'</b>';
    document.getElementById('nowlil').textContent=who+' · now until '+fmt(cur.e)+(next?' · next: '+next.label:'');
    document.getElementById('nowspine').style.background=css('--'+cur.cat);
  }else if(live&&next){
    document.getElementById('nowbig').textContent='Between activities';
    document.getElementById('nowlil').textContent=who+' · up next: '+next.label+' at '+fmt(next.s);
    document.getElementById('nowspine').style.background=css('--gold');
  }else if(live&&now>SCHOOL_END){
    document.getElementById('nowbig').textContent='School day has ended';
    document.getElementById('nowlil').textContent='Showing '+who+"'s full daily plan";
    document.getElementById('nowspine').style.background=css('--logistics');
  }else if(live){
    document.getElementById('nowbig').textContent='Before the school day';
    document.getElementById('nowlil').textContent='Showing '+who+"'s full daily plan · doors & breakfast from 8:40";
    document.getElementById('nowspine').style.background=css('--logistics');
  }else{
    document.getElementById('nowbig').textContent='Weekend';
    document.getElementById('nowlil').textContent='Showing '+who+"'s Monday–Friday plan";
    document.getElementById('nowspine').style.background=css('--logistics');
  }
}

// ---- main render ----
function render(){
  buildTabs();buildPicker();
  const modesEl=document.getElementById('modes');
  const vt=currentTitle();
  document.getElementById('vtitle').childNodes[0].nodeValue=vt.t;
  document.getElementById('vsub').textContent=vt.s;
  const stage=document.getElementById('stage');
  if(view==='interv'){
    modesEl.style.display='none';
    renderInterv();updateNowBar();return;
  }
  modesEl.style.display='flex';
  const list=currentList();
  stage.innerHTML='';
  stage.appendChild(mode==='list'?renderAgenda(list):renderTimeline(list));
  updateNowBar();
}

// mode buttons
document.querySelectorAll('.mode').forEach(btn=>{
  btn.onclick=()=>{mode=btn.dataset.m;
    document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x===btn));
    render();};
});

// clock
function tick(){
  const d=new Date();
  let h=d.getHours(),m=d.getMinutes(),ap=h<12?'AM':'PM',h12=h%12||12;
  document.getElementById('clock').textContent=h12+':'+String(m).padStart(2,'0')+' '+ap;
  const live=isSchoolDay()&&nowMin()>=SCHOOL_START&&nowMin()<=SCHOOL_END;
  document.getElementById('statusdot').className='dot'+(live?' live':'');
  document.getElementById('statustxt').textContent=live?'School in session':(isSchoolDay()?'Outside school hours':'Weekend');
}

render();tick();
setInterval(()=>{tick();if(view!=='interv')render();},30000);
</script>
</body>
</html>
